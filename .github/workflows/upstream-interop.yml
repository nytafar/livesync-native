# The interop scenarios (scripts/interop.sh) against the official
# Self-hosted LiveSync CLI of the pinned release (upstream.env) and, when
# upstream has a newer one, of that release too, weekly and by hand, so a
# breaking release is known before any device updates (COMPATIBILITY.md).
# The pin job fails when upstream has a newer plugin release or npm a newer
# @vrtmrz/livesync-commonlib than the pin: time for scripts/bump-upstream.sh.
#
# CouchDB runs as a throwaway service container published on port 8411
# (interop.sh accepts only 127.0.0.1:8411); its credentials exist
# only for this job. The official CLI is built from the release tag with
# scripts/upstream.sh (scripts/ci/upstream-cli.sh), without install scripts
# and without the job's token in reach (the checkout keeps no credentials,
# and only the step that looks up the latest release gets the token).
# Nothing is published: no release, no artefact, nothing pushed.
name: Upstream interop

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to test (empty: the pinned release, and the latest if newer)"
        required: false
        default: ""

concurrency:
  group: upstream-interop
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Throwaway: the CouchDB below lives only as long as this job.
  CI_COUCHDB_USER: ci
  CI_COUCHDB_PASSWORD: ci-throwaway-password

jobs:
  # The pin and what upstream has now. Never fails on a newer release (the
  # pin job below does), so the interop job still tests both.
  versions:
    name: pinned and latest upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pinned: ${{ steps.v.outputs.pinned }}
      latest: ${{ steps.v.outputs.latest }}
      pinned_commonlib: ${{ steps.v.outputs.pinned_commonlib }}
      latest_commonlib: ${{ steps.v.outputs.latest_commonlib }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      # The token only looks up the latest release (API rate limit); no
      # upstream code runs in this job.
      - name: Read the pin, look up upstream
        id: v
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          pinned=$(scripts/upstream.sh get PLUGIN_RELEASE)
          latest=$(scripts/ci/upstream-cli.sh --tag | sed -n 's/^tag=//p')
          pinned_commonlib=$(scripts/upstream.sh get COMMONLIB)
          latest_commonlib=$(npm view @vrtmrz/livesync-commonlib dist-tags.latest)
          if [[ -n "$TAG" ]]; then
            tags=$(jq -cn --arg t "$TAG" '[$t]')
          else
            tags=$(jq -cn --arg p "$pinned" --arg l "$latest" '[$p, $l] | unique')
          fi
          {
            echo "pinned=$pinned"; echo "latest=$latest"
            echo "pinned_commonlib=$pinned_commonlib"; echo "latest_commonlib=$latest_commonlib"
            echo "tags=$tags"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Upstream: pinned $pinned (commonlib $pinned_commonlib)"
            echo "latest release $latest, npm latest commonlib $latest_commonlib; interop runs $tags"
          } >> "$GITHUB_STEP_SUMMARY"

  # A newer plugin release or commonlib than the pin is a version devices
  # may already run: fail, so the pin, the fixtures and the Rust ports are
  # brought up to it (AGENTS.md, "Bumping upstream").
  pin:
    name: the pin is the latest upstream
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the pin with upstream
        env:
          PINNED: ${{ needs.versions.outputs.pinned }}
          LATEST: ${{ needs.versions.outputs.latest }}
          PINNED_LIB: ${{ needs.versions.outputs.pinned_commonlib }}
          LATEST_LIB: ${{ needs.versions.outputs.latest_commonlib }}
        run: |
          # newer A B: A is a higher version than B (by sort -V).
          newer() { [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]; }
          rc=0
          if newer "$LATEST" "$PINNED"; then
            echo "::error::upstream has Self-hosted LiveSync $LATEST, newer than the pin $PINNED in upstream.env (scripts/bump-upstream.sh)"
            rc=1
          fi
          if newer "$LATEST_LIB" "$PINNED_LIB"; then
            echo "::error::npm has @vrtmrz/livesync-commonlib $LATEST_LIB, newer than the pin $PINNED_LIB in upstream.env (scripts/bump-upstream.sh)"
            rc=1
          fi
          [[ $rc == 1 ]] || echo "the pin ($PINNED, commonlib $PINNED_LIB) is upstream's latest"
          exit $rc

  interop:
    name: interop against the official CLI ${{ matrix.tag }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.versions.outputs.tags) }}
    services:
      couchdb:
        image: couchdb:3.5
        env:
          COUCHDB_USER: ci
          COUCHDB_PASSWORD: ci-throwaway-password
          COUCHDB_SINGLE_NODE: "y"
        ports:
          - 8411:5984
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git/config for upstream's build to find.
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      # The build runs upstream code: it gets the tag and no token. A tag other
      # than the pin is announced by scripts/upstream.sh (and interop.sh).
      - name: Build the official CLI of the release
        id: cli
        env:
          LSYNC_UPSTREAM_TAG: ${{ matrix.tag }}
        run: |
          cli_js=$(LSYNC_REF_DIR="$RUNNER_TEMP/ref" scripts/upstream.sh cli)
          echo "cli_js=$cli_js" | tee -a "$GITHUB_OUTPUT"
      - name: Configure CouchDB
        env:
          COUCHDB_URL: http://127.0.0.1:8411
          COUCHDB_USER: ${{ env.CI_COUCHDB_USER }}
          COUCHDB_PASSWORD: ${{ env.CI_COUCHDB_PASSWORD }}
        run: scripts/ci/couchdb-init.sh
      - name: Interop scenarios
        env:
          LSYNC_CLI_JS: ${{ steps.cli.outputs.cli_js }}
          LSYNC_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          umask 077
          {
            echo "LSYNC_DEV_URL=http://127.0.0.1:8411"
            echo "LSYNC_DEV_DB=unused"
            echo "LSYNC_DEV_USER=$CI_COUCHDB_USER"
            echo "LSYNC_DEV_PASSWORD=$CI_COUCHDB_PASSWORD"
          } > "$LSYNC_DEV_ENV"
          echo "### Upstream interop: official CLI ${{ matrix.tag }} (pinned ${{ needs.versions.outputs.pinned }})" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          KEEP=1 scripts/interop.sh 2>&1 | tee "$RUNNER_TEMP/interop.txt"
      - name: Summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/interop.txt" ]]; then
            { echo '```'; grep -E '^(==|[SE][0-9]|  (PASS|FAIL)|passed )' "$RUNNER_TEMP/interop.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Logs of a failed run
        if: failure()
        run: |
          for w in /tmp/lsync-it.*; do
            [[ -d "$w" ]] || continue
            for f in "$w"/*.log; do
              echo "::group::$(basename "$f")"
              tail -n 200 "$f"
              echo "::endgroup::"
            done
          done
