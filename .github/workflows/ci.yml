# The repo's gate (AGENTS.md "Gate") on Linux and macOS, and the Android gate
# (scripts/build-apk.sh: JVM unit tests, lint, assembleRelease), unsigned.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --no-fail-fast

  android:
    name: android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-env
      - name: Android gate (unsigned)
        run: scripts/build-apk.sh --unsigned
        env:
          LIVESYNC_VERSION_CODE: "1"
          LIVESYNC_VERSION_NAME: ci-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk-unsigned
          path: dist/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
