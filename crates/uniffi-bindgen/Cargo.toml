[package]
name = "uniffi-bindgen"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
description = "UniFFI's binding generator, pinned to the uniffi version livesync-ffi uses"

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }
