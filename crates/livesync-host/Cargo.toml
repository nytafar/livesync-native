[package]
name = "livesync-host"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Hosts LiveSync vaults: accounts and vaults config, secret stores, one supervisor per vault"

[dependencies]
livesync-engine = { version = "0.1.0", path = "../livesync-engine" }
livesync-model = { version = "0.1.0", path = "../livesync-model" }
livesync-remote = { version = "0.1.0", path = "../livesync-remote" }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.15"
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The keyring store: the Secret Service over D-Bus (pure Rust, so the static
# musl builds keep working), and the macOS Keychain.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

[dev-dependencies]
livesync-crypto = { version = "0.1.0", path = "../livesync-crypto" }
axum = "0.8.9"
futures = "0.3.34"
tempfile = "3.27.0"
