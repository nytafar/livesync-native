[package]
name = "lsync"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
livesync-engine = { version = "0.1.0", path = "../livesync-engine" }
livesync-host = { version = "0.1.0", path = "../livesync-host" }
livesync-model = { version = "0.1.0", path = "../livesync-model" }
livesync-remote = { version = "0.1.0", path = "../livesync-remote" }
notify = "8.2"
percent-encoding = "2.3.2"
rand = "0.8"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8.9"
futures = "0.3.34"
tempfile = "3.27.0"
