[package]
name = "livesync-crypto"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "End-to-end encryption core for Self-hosted LiveSync (V2/HKDF); pure, no I/O"

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23.1"
getrandom = "0.4"
hkdf = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
zeroize = "1"
