[workspace]
resolver = "2"
members = [
    "crates/livesync-model",
    "crates/livesync-crypto",
    "crates/livesync-merge",
    "crates/livesync-remote",
    "crates/livesync-engine",
    "crates/livesync-host",
    "crates/lsync",
    "crates/livesync-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# PBKDF2 runs 310 000 rounds per key; unoptimised, that takes seconds in
# every test that opens an encrypted vault.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.livesync-crypto]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
