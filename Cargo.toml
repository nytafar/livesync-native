[workspace]
resolver = "2"
members = [
    "crates/livesync-model",
    "crates/livesync-remote",
    "crates/livesync-engine",
    "crates/lsync",
    "crates/livesync-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
